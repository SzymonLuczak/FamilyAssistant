name: family-assistant
x-defaults: &defaults
  restart: unless-stopped
  networks: [family-assistant-network]
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
services:
  family-core:
    networks: [family-assistant-network, host-access]
    build:
      context: .
      dockerfile: src/FamilyAssistant.Core/Dockerfile
    <<: *defaults
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      ASPNETCORE_ENVIRONMENT: Production
      Gateways__WhatsApp: http://whatsapp-gateway:3000
      Gateways__Vulcan: http://vulcan-gateway:8000
      Shopping__Account1Label: ${BIEDRONKA_ACCOUNT_1_LABEL:-Konto 1}
      Shopping__Account2Label: ${BIEDRONKA_ACCOUNT_2_LABEL:-Konto 2}
      Shopping__WhatsAppEnabled: ${SHOPPING_WHATSAPP_ENABLED:-false}
      Shopping__AnthropicApiKey: ${ANTHROPIC_API_KEY:-}
      Shopping__LeafletModel: ${LEAFLET_MODEL:-claude-sonnet-5}
      Shopping__LeafletMaxPagesPerRun: ${LEAFLET_MAX_PAGES:-120}
      Shopping__ProposalDay: ${SHOPPING_PROPOSAL_DAY:-}
      Shopping__ProposalTime: ${SHOPPING_PROPOSAL_TIME:-18:00}
      Summary__SchedulerEnabled: ${SUMMARY_SCHEDULER_ENABLED:-true}
      Summary__SendEnabled: ${SUMMARY_SEND_ENABLED:-false}
      Summary__GroupId: ${WHATSAPP_GROUP_ID:-}
      Google__TimeZone: ${TZ:-Europe/Warsaw}
      Google__RedirectUri: http://localhost:${CORE_PORT:-8080}/google/callback
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-false}
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    volumes:
      - family-data:/app/data
      - google-token:/app/secrets/google
      - ./secrets:/app/config-secrets:ro
      - ./config:/app/config:ro
      - ./imports/biedronka:/app/imports/biedronka
      - ${BIEDRONKA_DOWNLOADS_DIR:-./imports/browser-downloads}:/app/browser-receipts:ro
  biedronka-gateway:
    profiles: [legacy-biedronka]
    hostname: family-biedronka
    <<: *defaults
    networks: [family-assistant-network, biedronka-egress]
    init: true
    shm_size: 512m
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: src/FamilyAssistant.BiedronkaGateway/Dockerfile
    environment:
      ACCOUNT_1_LABEL: ${BIEDRONKA_ACCOUNT_1_LABEL:-Konto 1}
      ACCOUNT_2_LABEL: ${BIEDRONKA_ACCOUNT_2_LABEL:-Konto 2}
    ports:
      - "127.0.0.1:8081:6080"
    volumes:
      - biedronka-session:/state
      - ./imports/biedronka:/imports
  vulcan-gateway:
    networks: [family-assistant-network, vulcan-egress]
    build:
      context: .
      dockerfile: src/FamilyAssistant.VulcanGateway/Dockerfile
    <<: *defaults
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - vulcan-session:/app/session
  whatsapp-gateway:
    hostname: family-whatsapp
    networks: [family-assistant-network, whatsapp-egress]
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: src/FamilyAssistant.WhatsAppGateway/Dockerfile
    <<: *defaults
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      WHATSAPP_SEND_ENABLED: ${WHATSAPP_SEND_ENABLED:-false}
      WHATSAPP_AUTO_CONNECT: ${WHATSAPP_AUTO_CONNECT:-false}
    volumes:
      - whatsapp-session:/app/.wwebjs_auth
networks:
  host-access:
  whatsapp-egress:
  vulcan-egress:
  biedronka-egress:
  family-assistant-network:
    internal: true
volumes:
  family-data:
  whatsapp-session:
  vulcan-session:
  google-token:
  biedronka-session:
